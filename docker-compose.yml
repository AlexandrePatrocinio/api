# Limits: 4 vCPUs, 8GB RAM
# Max simultaneous users tested: 400
# Max RPS: ~4000
# Avg Latency(p95): ~85ms
x-api-common: &api-common
  build:
    context: .
    args:
      BUILDPLATFORM: linux/amd64
  image: api:v1
  volumes:
    - ./Configuration:/app/Configuration
  environment:
    ASPNETCORE_ENVIRONMENT: ''
    # ⚙️ .NET Runtime optimized for high concurrency
    COMPlus_gcServer: '1'                # Server GC
    COMPlus_GCHeapCount: '2'             # parallel heaps
    COMPlus_ThreadPool_ForceMinWorkerThreads: '100'
    COMPlus_ThreadPool_ForceMinIOThreads: '100'
  depends_on:
    - db
  # 🚀 Host mode: eliminates NAT bridge and reduces latency ~1ms
  network_mode: host
  deploy:
    resources:
      limits:
        cpus: '0.85'
        memory: '1.536GB'

services:
  # API - Instances
  api1:
    <<: *api-common
    hostname: api1
    container_name: api1
    environment:
      API_PORT: 8080
    cpuset: "0,1"

  api2:
    <<: *api-common
    hostname: api2
    container_name: api2
    environment:
      API_PORT: 8081
    cpuset: "0,1"

  # Load Balancer
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: '1.024GB'

  # PostgreSQL Database
  db:
    build: SQLScripts/Postgres/.
    image: postgres:api
    container_name: db
    environment:
      POSTGRES_DB: 'api'
      POSTGRES_PASSWORD: ${SA_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_MAX_CONNECTIONS: '350'
      POSTGRES_SHARED_BUFFERS: '1GB'
      POSTGRES_WORK_MEM: '8MB'
      POSTGRES_EFFECTIVE_CACHE_SIZE: '3GB'
      POSTGRES_SYNCHRONOUS_COMMIT: 'off'
    volumes:
      - ./SQLScripts/Postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro      
    network_mode: host
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: '4.096GB'
